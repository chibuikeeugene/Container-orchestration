apiVersion: v1 
kind: Pod
metadata:
  name: resource-demo
spec:
  containers:
  - name: demo
    image: busybox:1.36
    command:
      - sh
      - -c
    args:
      - |
        while true;
        do 
          echo running
          sleep 5
        done

    resources:
      requests:
        memory: 128Mi
        cpu: "250m"
      limits:
        memory: "256Mi"
        cpu: "500m"
