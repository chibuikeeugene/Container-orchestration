apiVersion: v1
kind: Pod
metadata:
  name: test-pod
  labels:
    app.kubernetes.io/name: test-pod-pvc
spec:
  containers:
  - name: test-pod
    image: busybox:1.36
    volumeMounts:
      - name: test-pvc
        mountPath: /data

  volumes:
    - name: test-pvc
      persistentVolumeClaim:
        claimName: test-pvc-demo