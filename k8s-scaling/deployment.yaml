apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-deploy
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nginx-scaling-app
  template:
    metadata:
      labels:
        app: nginx-scaling-app
    spec:
      containers:
      - name: nginx-scaling-app
        image: busybox:1.36
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "250Mi"
            cpu: "500m"

