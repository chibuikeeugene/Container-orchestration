apiVersion: batch/v1
kind: Job
metadata:
  name: store-job
spec:
  ttlSecondsAfterFinished: 100
  template:
    spec:
      containers:
      - name: store-job
        image: busybox:1.36
        command:
          - sh
          - -c
        args:
          - |
            echo "running report generation for store"
            sleep 30
            echo 'job completed'
      restartPolicy: Never
  backoffLimit: 3
  completions: 5
  parallelism: 2
