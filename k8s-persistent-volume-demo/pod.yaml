apiVersion: v1
kind: Pod
metadata:
  name: persistent-volume-claim-demo
  labels:
    app.kubernetes.io/name: mypvc-demo
spec:
  containers:
  - name: mypvc-demo
    image: busybox:1.36
    command: 
      - sh
      - -c
    args:
      - |
        echo "persistent data" >> /data/file.txt
        sleep 600
    volumeMounts:
      - name: pvc-volume
        mountPath: /data
  
  volumes:
    - name: pvc-volume
      persistentVolumeClaim: 
        claimName: pvc-demo
      

    
