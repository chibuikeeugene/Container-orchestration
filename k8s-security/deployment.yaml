apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: development
spec:
  selector:
    matchLabels:
      app: webapp
  securityContext:
    fsGroup: 3000 # helps provide the Pod's processes with group-based access to mounted volumes.
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
      - name: webapp
        image: busybox:1.36

        securityContext:
          runAsNonRoot: true
          runAsUser: 2000
          allowPrivilegeEscalation: false
          readOnlyRootFileSystem: true
          capabilities:
            drop:
              - ALL

        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 80
