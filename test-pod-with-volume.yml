apiVersion: v1
kind: Pod
metadata:
  name: shared-volume-demo
spec:
  containers:
  - name: writer
    image: busybox:1.36
    command:
      - sh
      - -c
    args: 
      - |
        while true; do
          date >> /shared/output.txt
          sleep 5
        done
    volumeMounts:
      - name: shared
        mountPath: /shared

  - name: reader
    image: busybox:1.36
    command:
      - sh
      - -c

    args: 
      - |
        while true;
        do
          cat /shared/output.txt
          sleep 5
        done
    volumeMounts:
      - name: shared
        mountPath: /shared
    
  volumes:
    - name: shared
      emptyDir: {}