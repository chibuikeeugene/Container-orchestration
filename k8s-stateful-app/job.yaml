apiVersion: batch/v1
kind: Job
metadata:
  name: calculation-job
spec:
  ttlSecondsAfterFinished: 100
  template:
    spec:
      containers:
      - name: calculator
        image: busybox:1.36
        command:
          - sh
          - -c
        args:
          - |
            echo "Starting the batch job"
            sleep 5
            echo "batch job completed"
      restartPolicy: OnFailure
  backoffLimit: 3
  completions: 5
  parallelism: 2
      
