apiVersion: batch/v1
kind: CronJob
metadata:
  name: schedule-task-cronjob
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: task
            image: busybox:1.36
            command:
            - /bin/sh
            - -c
            args:
            - date; echo Hello from the Kubernetes cluster
          restartPolicy: OnFailure
  suspend: true
