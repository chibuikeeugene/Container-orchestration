apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: database
spec:
  selector:
    matchLabels:
      app: database
  serviceName: database
  replicas: 2
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
      - name: database
        image: postgres:17
        ports:
          - containerPort: 5432
        env:
          - name: POSTGRES_PASSWORD
            value: password
        volumeMounts:
          - name: data
            mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
