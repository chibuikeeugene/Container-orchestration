apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-lab
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-lab-app
  template:
    metadata:
      labels:
        app: web-lab-app
    spec:
      containers:
      - name: web-lab-app
        image: nginx:alpine
        ports:
        - containerPort: 80
