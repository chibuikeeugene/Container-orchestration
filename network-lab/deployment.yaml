apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-lab-app
  template:
    metadata:
      labels:
        app: web-lab-app
    spec:
      containers:
      - name: web-lab-app
        image: busybox:1.36
        ports:
        - containerPort: 80
        envFrom:
          - configMapRef:
              name: api-config
          - secretRef:
              name: database-secret
        command:
          - sh
          - -c
        args:
          - |
            env
            sleep 3600