apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache
spec:
  replicas: 5
  selector:
    matchLabels:
      app: apache
  template:
    metadata:
      labels:
        app: apache
    spec:
      containers:
      - name: apache-web-server
        image: httpd:alpine
        ports:
        - containerPort: 80
