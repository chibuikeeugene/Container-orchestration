apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-kustomize-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-kustomize-demo
  template:
    metadata:
      labels:
        app: nginx-kustomize-demo
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
